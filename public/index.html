<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>تحليل الحسابات البنكية</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0c0c1d;
    --card: #151530;
    --card2: #1c1c3a;
    --border: #2a2a50;
    --text: #eaeaf5;
    --text2: #8888aa;
    --red: #ff6b6b;
    --green: #4ecdc4;
    --blue: #45b7d1;
    --gold: #ffd93d;
    --purple: #a29bfe;
    --accent: #6c63ff;
    --R: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    direction: rtl;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    line-height: 1.6;
}

/* HEADER */
.hdr {
    background: linear-gradient(160deg, #0c0c2d 0%, #1a1050 40%, #6c63ff 100%);
    padding: 50px 20px 40px;
    text-align: center;
}
.hdr h1 { font-size: 1.8em; font-weight: 900; }
.hdr p { font-size: 0.85em; color: rgba(255,255,255,0.6); margin-top: 4px; }

/* TOTALS */
.totals {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    margin: -24px 14px 0;
    position: relative; z-index: 2;
    border-radius: var(--R);
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    border: 1px solid var(--border);
}
.tot {
    background: var(--card);
    padding: 14px 6px;
    text-align: center;
    border-left: 1px solid var(--border);
}
.tot:last-child { border-left: none; }
.tot-v { font-size: 1.1em; font-weight: 900; direction: ltr; display: inline-block; }
.tot-l { font-size: 0.65em; color: var(--text2); margin-top: 2px; }

/* TABS */
.tabs {
    display: flex;
    gap: 8px;
    padding: 18px 14px 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
    flex-shrink: 0;
    padding: 9px 20px;
    border-radius: 25px;
    font-size: 0.85em;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--text2);
    white-space: nowrap;
    font-family: inherit;
    transition: all 0.25s;
}
.tab-btn.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
}

/* MONTH FILTER */
.month-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
}
.mo-btn {
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-family: inherit;
    transition: all 0.25s;
}
.mo-btn.on {
    background: var(--purple);
    border-color: var(--purple);
    color: #fff;
}

/* PANELS */
.panels { padding: 14px; }
.pnl { display: none; }
.pnl.on { display: block; }

/* CARDS */
.cd {
    background: var(--card);
    border-radius: var(--R);
    padding: 18px 14px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
}
.cd-t {
    font-size: 1em;
    font-weight: 800;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
}

/* STATS */
.sts {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 10px;
    margin-bottom: 14px;
}
.st {
    background: var(--card2);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    border: 1px solid var(--border);
}
.st-i { font-size: 1.4em; margin-bottom: 4px; }
.st-v { font-size: 1.2em; font-weight: 900; direction: ltr; display: inline-block; }
.st-l { font-size: 0.7em; color: var(--text2); margin-top: 2px; }

/* INFO ROWS */
.inf { display: grid; gap: 6px; }
.inf-r {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: var(--card2);
    border-radius: 10px;
    font-size: 0.82em;
}
.inf-k { color: var(--text2); }
.inf-v { font-weight: 700; direction: ltr; text-align: left; max-width: 55%; word-break: break-all; font-size: 0.9em; }

/* CATEGORY ROWS */
.cr { margin-bottom: 14px; }
.cr-top { display: flex; justify-content: space-between; margin-bottom: 4px; }
.cr-nm { font-weight: 700; font-size: 0.88em; }
.cr-cnt { font-size: 0.72em; color: var(--text2); }
.cr-bg { height: 8px; background: var(--card2); border-radius: 8px; overflow: hidden; }
.cr-fill { height: 100%; border-radius: 8px; }
.cr-bot { display: flex; justify-content: space-between; margin-top: 3px; }
.cr-am { font-size: 0.78em; font-weight: 700; direction: ltr; }
.cr-pc { font-size: 0.72em; color: var(--text2); }

/* MERCHANTS */
.mi {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px;
    background: var(--card2);
    border-radius: 12px;
    margin-bottom: 7px;
}
.mi-rk {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 0.75em;
    flex-shrink: 0;
}
.mi-inf { flex: 1; min-width: 0; }
.mi-nm { font-weight: 700; font-size: 0.82em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mi-ct { font-size: 0.68em; color: var(--text2); }
.mi-am { font-weight: 900; font-size: 0.85em; color: var(--red); direction: ltr; flex-shrink: 0; }
.mi-am small { font-size: 0.7em; opacity: 0.6; }

/* CHARTS */
.ch { position: relative; height: 250px; margin: 8px 0; }

/* TABLE */
.srch {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--card2);
    color: var(--text);
    font-family: inherit;
    font-size: 0.88em;
    margin-bottom: 10px;
    outline: none;
}
.srch:focus { border-color: var(--accent); }
.tw { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); max-height: 500px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.78em; white-space: nowrap; }
thead th {
    background: var(--card2);
    padding: 10px 8px;
    text-align: right;
    font-weight: 700;
    color: var(--text2);
    position: sticky; top: 0; z-index: 5;
}
tbody td { padding: 9px 8px; border-bottom: 1px solid rgba(42,42,80,0.5); }
tbody tr:hover { background: rgba(108,99,255,0.06); }
.exp-c { color: var(--red); font-weight: 800; }
.inc-c { color: var(--green); font-weight: 800; }
.bal-c { color: var(--text2); font-size: 0.9em; }

/* COMPARE */
.cmp-g { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.cmp-c {
    background: var(--card2);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    border: 1px solid var(--border);
}
.cmp-c.rj { border-top: 3px solid var(--green); }
.cmp-c.sn { border-top: 3px solid var(--blue); }
.cmp-bn { font-weight: 800; font-size: 0.85em; margin-bottom: 8px; }
.cmp-i { margin-bottom: 10px; }
.cmp-v { font-size: 1.05em; font-weight: 900; direction: ltr; display: inline-block; }
.cmp-l { font-size: 0.68em; color: var(--text2); }

footer {
    text-align: center;
    padding: 18px;
    font-size: 0.72em;
    color: var(--text2);
    margin-top: 16px;
}

@media (min-width: 768px) {
    .hdr h1 { font-size: 2.5em; }
    .totals { max-width: 640px; margin-left: auto; margin-right: auto; }
    .panels { max-width: 900px; margin: 0 auto; }
    .sts { grid-template-columns: repeat(4,1fr); }
    .tot-v { font-size: 1.4em; }
    .ch { height: 320px; }
}
</style>
</head>

function catMerchant(merchant, desc) {
    const m = (merchant + ' ' + (desc||'')).toLowerCase();

    const rules = [
        [/restaurant|resturant|food|chicken|grill|hunger|hungerstation|shawayat|express food|basha|ramz|mataeim|kawtar|bufya|nusantara|atlal|atyab|mohammed zuhair|mohsen|ssp arabia|keef|zaman|abdulmohsen|abnaa|nukhbat|qurtoba|mtam|dlal|bowling|al atlal/i, '🍽️ مطاعم وأكل'],
        [/lulu|market|grocery|superstore|farm superstore|huda|alreef|reef|veget|thimarna|zayed|shahad|kayan|almorki|madina hyper|almajd|afaq|nasim|makhazin|alwashim|poult|kother|kothor|joy mart|alsaqr|hazzaz|saqar|ali matar|khalid ali|al madina|rawaat|amaal/i, '🛒 بقالة ومتاجر'],
        [/uber|bus|metro|riyadh bus|riyadh metro|almasa|taxi|trip/i, '🚗 مواصلات'],
        [/noon|amazon|شراء أونلاين|online|أونلاين/i, '🌐 تسوق أونلاين'],
        [/stc|sadad|سداد|فواتير|urpay/i, '📱 فواتير وخدمات'],
        [/medical|green crescent|pharmacy|hospital|صحة|صيدلية/i, '🏥 صحة'],
        [/hiraf|ibdaiya|zhrat|alfrsan|dar al|moda|shamil|alshamil|تسوق/i, '🛍️ تسوق'],
        [/تحويل|حوالة/i, '💸 تحويلات'],
        [/سحب|صراف|atm|cash/i, '🏧 سحب نقدي'],
        [/رسوم|fees/i, '💳 رسوم بنكية'],
        [/خصم/i, '📄 خصم مباشر'],
    ];

    for (const [rx, cat] of rules) {
        if (rx.test(m)) return cat;
    }
    if (merchant && merchant.trim().length > 2) return '🏪 متاجر أخرى';
    return '📋 غير مصنف';
}

// ============================================================
// ANALYSIS
// ============================================================
function analyze(txs) {
    let totD = 0, totC = 0;
    const catT = {}, catN = {}, mT = {}, mN = {}, daily = {}, typeN = {};

    txs.forEach(t => {
        totD += t.debit;
        totC += t.credit;
        const cat = catMerchant(t.m, t.desc);
        typeN[t.desc] = (typeN[t.desc]||0) + 1;
        if (t.type === 'exp') {
            catT[cat] = (catT[cat]||0) + t.amt;
            catN[cat] = (catN[cat]||0) + 1;
            daily[t.d] = (daily[t.d]||0) + t.amt;
            if (t.m && t.m.trim()) {
                mT[t.m] = (mT[t.m]||0) + t.amt;
                mN[t.m] = (mN[t.m]||0) + 1;
            }
        }
    });

    const nExp = txs.filter(t=>t.type==='exp').length;
    const cats = Object.entries(catT).sort((a,b)=>b[1]-a[1]);
    const merch = Object.entries(mT).sort((a,b)=>b[1]-a[1]).slice(0,12);
    const dailyS = Object.entries(daily).sort((a,b)=>a[0].localeCompare(b[0]));

    return { totD, totC, cats, catN, merch, mN, dailyS, typeN, nExp, nInc: txs.filter(t=>t.type==='inc').length, avgE: nExp ? totD/nExp : 0 };
}

function catsHTML(cats, catN) {
    const mx = cats.length ? cats[0][1] : 1;
    return cats.map((c,i) => {

        const n = catN[c[0]]||0;
        const col = COLORS[i%COLORS.length];
        return `<div class="cr"><div class="cr-top"><span class="cr-nm">${c[0]}</span><span class="cr-cnt">${n} عملية</span></div><div class="cr-bg"><div class="cr-fill" style="width:${Math.max(3,pct)}%;background:${col}"></div></div><div class="cr-bot"><span class="cr-am">${fmt(c[1])} ر.س</span><span class="cr-pc">${pct.toFixed(1)}%</span></div></div>`;

}

function merchHTML(merch, mN) {
    return merch.map((m,i) => {
        const n = mN[m[0]]||0;
        const cat = catMerchant(m[0],'');
        return `<div class="mi"><span class="mi-rk">${i+1}</span><div class="mi-inf"><div class="mi-nm">${m[0]}</div><div class="mi-ct">${n} عملية · ${cat}</div></div><span class="mi-am">${fmt(m[1])}<small> ر.س</small></span></div>`;
    }).join('');
}

function tblHTML(txs, id) {
    const rows = txs.map(t => {
        const cls = t.type==='exp' ? 'exp-c' : 'inc-c';
        const sign = t.type==='exp' ? '-' : '+';
        return `<tr><td style="color:var(--text2);font-size:0.9em">${t.d}</td><td style="max-width:140px;overflow:hidden;text-overflow:ellipsis">${t.m||t.desc}</td><td class="${cls}" style="direction:ltr;text-align:left">${sign}${fmt(t.amt)}</td><td class="bal-c" style="direction:ltr;text-align:left">${fmt(t.bal)}</td></tr>`;
    }).join('');
    return `<input class="srch" placeholder="🔍 بحث..." oninput="filt('${id}',this.value)">
        <div class="tw"><table id="${id}"><thead><tr><th>التاريخ</th><th>الوصف</th><th>المبلغ</th><th>الرصيد</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function filt(id, q) {
    q = q.toLowerCase();
    document.querySelectorAll('#'+id+' tbody tr').forEach(r => {
        r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
}

const charts = {};
function mkPie(id, labels, data) {
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart(document.getElementById(id), {
        type: 'doughnut',
        data: { labels, datasets: [{ data, backgroundColor: COLORS, borderWidth: 0 }] },
        options: {
            responsive: true, maintainAspectRatio: false, cutout: '55%',
            plugins: { legend: { position: 'bottom', labels: { padding: 10, font: { size: 10, family: 'Tajawal' }, color: '#8888aa' } } }
        }
    });
}
function mkBar(id, labels, data, color) {
    if (charts[id]) charts[id].destroy();
    charts[id] = new Chart(document.getElementById(id), {
        type: 'bar',
        data: { labels, datasets: [{ data, backgroundColor: color, borderRadius: 5 }] },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { ticks: { font: { size: 7, family: 'Tajawal' }, color: '#8888aa', maxRotation: 55 }, grid: { display: false } },
                y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#8888aa', font: { family: 'Tajawal' } } }
            }
        }
    });
}

const MONTH_NAMES = {1:'يناير',2:'فبراير',3:'مارس',4:'أبريل',5:'مايو',6:'يونيو',7:'يوليو',8:'أغسطس',9:'سبتمبر',10:'أكتوبر',11:'نوفمبر',12:'ديسمبر'};
function txMonth(t) {
    // date is YYYY/MM/DD
    const parts = t.d.split('/');
    return parseInt(parts[1]);
}
function getMonths(txs) {
    const ms = new Set();
    txs.forEach(t => ms.add(txMonth(t)));
    return [...ms].sort();
}
function filterByMonth(txs, month) {
    if (!month) return txs;
    return txs.filter(t => txMonth(t) === month);
}

}

function renderRajhi() {
    const a = analyze(R_TX);
    const el = document.getElementById('rajhi');
    el.innerHTML = `
        ${statsHTML(a)}
        <div class="cd"><div class="cd-t">ℹ️ معلومات الحساب</div><div class="inf">
            <div class="inf-r"><span class="inf-k">العميل</span><span class="inf-v">${R_INFO.customer}</span></div>
            <div class="inf-r"><span class="inf-k">رقم الحساب</span><span class="inf-v">${R_INFO.account}</span></div>
            <div class="inf-r"><span class="inf-k">الآيبان</span><span class="inf-v">${R_INFO.iban}</span></div>
            <div class="inf-r"><span class="inf-k">الفترة</span><span class="inf-v">${R_INFO.period}</span></div>
            <div class="inf-r"><span class="inf-k">رصيد افتتاحي</span><span class="inf-v">${fmt(R_INFO.opening_balance)} ر.س</span></div>
            <div class="inf-r"><span class="inf-k">رصيد ختامي</span><span class="inf-v">${fmt(R_INFO.closing_balance)} ر.س</span></div>
        </div></div>
        <div class="cd"><div class="cd-t">🥧 توزيع المصروفات</div><div class="ch"><canvas id="rPie"></canvas></div></div>
        <div class="cd"><div class="cd-t">📂 تفصيل الفئات</div>${catsHTML(a.cats, a.catN)}</div>
        <div class="cd"><div class="cd-t">📅 الإنفاق اليومي</div><div class="ch"><canvas id="rBar"></canvas></div></div>
        <div class="cd"><div class="cd-t">🏪 أكثر المتاجر إنفاقاً</div>${merchHTML(a.merch, a.mN)}</div>
        <div class="cd"><div class="cd-t">📋 جميع العمليات (${R_TX.length})</div>${tblHTML(R_TX, 'rTbl')}</div>
    `;
    mkPie('rPie', a.cats.map(c=>c[0]), a.cats.map(c=>c[1]));
    mkBar('rBar', a.dailyS.map(d=>d[0].slice(5)), a.dailyS.map(d=>d[1]), '#FF6B6B');
}

function renderSNB() {
    const months = getMonths(S_TX);
    const filtered = filterByMonth(S_TX, snbMonth);
    const a = analyze(filtered);
    const el = document.getElementById('snb');

    let monthBar = '<div class="month-bar">';
    monthBar += `<button class="mo-btn ${snbMonth===null?'on':''}" onclick="snbMonth=null;renderSNB()">📅 الكل</button>`;
    months.forEach(mo => {
        monthBar += `<button class="mo-btn ${snbMonth===mo?'on':''}" onclick="snbMonth=${mo};renderSNB()">${MONTH_NAMES[mo]}</button>`;
    });
    monthBar += '</div>';

    const periodLabel = snbMonth ? MONTH_NAMES[snbMonth] + ' 2026' : S_INFO.period;

    el.innerHTML = `
        ${monthBar}
        ${statsHTML(a)}
        <div class="cd"><div class="cd-t">ℹ️ معلومات الحساب</div><div class="inf">
            <div class="inf-r"><span class="inf-k">العميل</span><span class="inf-v">${S_INFO.customer}</span></div>
            <div class="inf-r"><span class="inf-k">رقم الحساب</span><span class="inf-v">${S_INFO.account}</span></div>
            <div class="inf-r"><span class="inf-k">الفترة</span><span class="inf-v">${periodLabel}</span></div>
            <div class="inf-r"><span class="inf-k">العمليات</span><span class="inf-v">${filtered.length} عملية</span></div>
        </div></div>
        <div class="cd"><div class="cd-t">🥧 توزيع المصروفات</div><div class="ch"><canvas id="sPie"></canvas></div></div>
        <div class="cd"><div class="cd-t">📂 تفصيل الفئات</div>${catsHTML(a.cats, a.catN)}</div>
        <div class="cd"><div class="cd-t">📅 الإنفاق اليومي</div><div class="ch"><canvas id="sBar"></canvas></div></div>
        <div class="cd"><div class="cd-t">🏪 أكثر المتاجر إنفاقاً</div>${merchHTML(a.merch, a.mN)}</div>
        <div class="cd"><div class="cd-t">📋 جميع العمليات (${filtered.length})</div>${tblHTML(filtered, 'sTbl')}</div>
    `;
    mkPie('sPie', a.cats.map(c=>c[0]), a.cats.map(c=>c[1]));
    mkBar('sBar', a.dailyS.map(d=>d[0].slice(5)), a.dailyS.map(d=>d[1]), '#45B7D1');
}

function renderCmp() {
    const snbMonths = getMonths(S_TX);
    // Rajhi is mostly August
    const rajhiMonth = 8;

    if (cmpSnbMonth === null) cmpSnbMonth = 8; // default to August for fair comparison

    const rFiltered = R_TX; // Rajhi is one month only
    const sFiltered = filterByMonth(S_TX, cmpSnbMonth);
    const ra = analyze(rFiltered);
    const sa = analyze(sFiltered);

    let monthBar = '<div class="cd"><div class="cd-t">📅 اختر شهر الأهلي للمقارنة</div><div class="month-bar">';
    snbMonths.forEach(mo => {
        monthBar += `<button class="mo-btn ${cmpSnbMonth===mo?'on':''}" onclick="cmpSnbMonth=${mo};renderCmp()">${MONTH_NAMES[mo]}</button>`;
    });
    monthBar += '</div></div>';

    const el = document.getElementById('cmp');
    el.innerHTML = `
        ${monthBar}
        <div class="cmp-g">
            <div class="cmp-c rj">
                <div class="cmp-bn">🏦 الراجحي<br><small style="color:var(--text2);font-weight:400">أغسطس - سبتمبر</small></div>
                <div class="cmp-i"><div class="cmp-v" style="color:var(--red)">${fmt0(ra.totD)}</div><div class="cmp-l">مصروفات</div></div>
                <div class="cmp-i"><div class="cmp-v" style="color:var(--green)">${fmt0(ra.totC)}</div><div class="cmp-l">إيداعات</div></div>
                <div class="cmp-i"><div class="cmp-v">${rFiltered.length}</div><div class="cmp-l">عملية</div></div>
                <div class="cmp-i"><div class="cmp-v">${fmt0(ra.avgE)}</div><div class="cmp-l">متوسط مصروف</div></div>
            </div>
            <div class="cmp-c sn">
                <div class="cmp-bn">🏦 الأهلي<br><small style="color:var(--text2);font-weight:400">${MONTH_NAMES[cmpSnbMonth]} 2026</small></div>
                <div class="cmp-i"><div class="cmp-v" style="color:var(--red)">${fmt0(sa.totD)}</div><div class="cmp-l">مصروفات</div></div>
                <div class="cmp-i"><div class="cmp-v" style="color:var(--green)">${fmt0(sa.totC)}</div><div class="cmp-l">إيداعات</div></div>
                <div class="cmp-i"><div class="cmp-v">${sFiltered.length}</div><div class="cmp-l">عملية</div></div>
                <div class="cmp-i"><div class="cmp-v">${fmt0(sa.avgE)}</div><div class="cmp-l">متوسط مصروف</div></div>
            </div>
        </div>
        <div class="cd"><div class="cd-t">📊 مقارنة الإجماليات</div><div class="ch" style="height:280px"><canvas id="cmpBar"></canvas></div></div>
        <div class="cd"><div class="cd-t">📊 مقارنة الفئات</div><div class="ch" style="height:${Math.max(260, (new Set([...ra.cats.map(c=>c[0]),...sa.cats.map(c=>c[0])])).size * 36)}px"><canvas id="cmpCat"></canvas></div></div>
    `;

    // Comparison bar chart
    if (charts['cmpBar']) charts['cmpBar'].destroy();
    charts['cmpBar'] = new Chart(document.getElementById('cmpBar'), {
        type: 'bar',
        data: {
            labels: ['المصروفات', 'الإيداعات', 'متوسط المصروف'],
            datasets: [
                { label: 'الراجحي', data: [ra.totD, ra.totC, ra.avgE], backgroundColor: 'rgba(78,205,196,0.8)', borderRadius: 6 },
                { label: 'الأهلي - '+MONTH_NAMES[cmpSnbMonth], data: [sa.totD, sa.totC, sa.avgE], backgroundColor: 'rgba(69,183,209,0.8)', borderRadius: 6 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { font: { size: 12, family: 'Tajawal' }, color: '#8888aa' } } },
            scales: {
                x: { grid: { display: false }, ticks: { color: '#8888aa', font: { family: 'Tajawal' } } },
                y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#8888aa', font: { family: 'Tajawal' } } }
            }
        }
    });

    // Category comparison
    const allCats = [...new Set([...ra.cats.map(c=>c[0]), ...sa.cats.map(c=>c[0])])].sort();
    const rDict = Object.fromEntries(ra.cats);
    const sDict = Object.fromEntries(sa.cats);

    if (charts['cmpCat']) charts['cmpCat'].destroy();
    charts['cmpCat'] = new Chart(document.getElementById('cmpCat'), {
        type: 'bar',
        data: {
            labels: allCats,
            datasets: [
                { label: 'الراجحي', data: allCats.map(c=>rDict[c]||0), backgroundColor: 'rgba(78,205,196,0.7)', borderRadius: 4 },
                { label: 'الأهلي - '+MONTH_NAMES[cmpSnbMonth], data: allCats.map(c=>sDict[c]||0), backgroundColor: 'rgba(69,183,209,0.7)', borderRadius: 4 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false, indexAxis: 'y',
            plugins: { legend: { labels: { font: { size: 11, family: 'Tajawal' }, color: '#8888aa' } } },
            scales: {
                x: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#8888aa', font: { family: 'Tajawal' } } },
                y: { grid: { display: false }, ticks: { color: '#8888aa', font: { size: 10, family: 'Tajawal' } } }
            }
        }
    });
}

// ============================================================
// INIT
// ============================================================
Chart.defaults.color = '#8888aa';
Chart.defaults.font.family = 'Tajawal';

renderTotals();
renderRajhi();
renderSNB();

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('on'));
        document.querySelectorAll('.pnl').forEach(p => p.classList.remove('on'));
        btn.classList.add('on');
        const t = btn.dataset.t;
        document.getElementById(t).classList.add('on');
        // Lazy render comparison
        if (t === 'cmp') renderCmp();
    });
});

document.getElementById('footer').textContent = '📊 تم إنشاء التقرير تلقائياً · ' + new Date().toLocaleDateString('ar-SA');
</script>
</body>
